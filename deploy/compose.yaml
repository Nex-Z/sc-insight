name: sc-insight
services:
  app:
    image: sc-insight:0.1.7
    build: ./release
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-13010}:3010"
    environment:
      PGHOST: ${PGHOST:-host.docker.internal}
      PGPORT: ${PGPORT:-15432}
      PGDATABASE: ${PGDATABASE:-sc_insight_app}
      PGUSER: ${PGUSER:-sc_insight_app}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      HOST: 0.0.0.0
      PORT: 3010
      RECORDING_CONCURRENCY: ${RECORDING_CONCURRENCY:-2}
    volumes:
      - ./data/recordings:/app/storage/recordings
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
