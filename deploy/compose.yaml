name: sc-insight
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sc_insight
      POSTGRES_USER: sc_insight
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sc_insight -d sc_insight]
      interval: 10s
      timeout: 5s
      retries: 12
  app:
    image: sc-insight:0.1.3
    build: ./release
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-13010}:3010"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: sc_insight
      PGUSER: sc_insight
      PGPASSWORD: ${DB_PASSWORD}
      HOST: 0.0.0.0
      PORT: 3010
      RECORDING_CONCURRENCY: ${RECORDING_CONCURRENCY:-2}
    volumes:
      - ./data/recordings:/app/storage/recordings
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
